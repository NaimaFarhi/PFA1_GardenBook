{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container mt-5">
  <div class="card shadow-sm rounded-4">
    <div class="card-header bg-brown text-white">
      <h4 class="mb-0">Add a new User</h4>
    </div>

    <div class="card-body">
      <form method="POST">
        {% csrf_token %}
        {% crispy form %}


      </form>
    </div>
  </div>
</div>
{% endblock %}
